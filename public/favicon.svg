<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B9BF7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Blue-purple gradient circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Letter F in white -->
  <text x="32" y="43" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">F</text>
  <!-- Sparkle dot -->
  <circle cx="50" cy="16" r="3" fill="rgba(255,255,255,0.85)"/>
